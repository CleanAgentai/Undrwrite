# Fly.io config for Vienna (Undrwrite backend). Replaced Render (suspended 2026-06-30).
#
# Exactly ONE always-on machine: the daily-summary/reminder cron runs in-process
# (src/cron/dailySummary.js startCron), and Postmark's inbound webhook expects a
# warm server. Do not scale out or enable auto-stop.
#
# Secrets are NOT in this file. Set them with `fly secrets set` (see .env.example
# for the list): ADMIN_EMAIL, POSTMARK_API_TOKEN, POSTMARK_SENDER_EMAIL,
# CLAUDE_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY, CRON_SECRET.

app = "vienna-undrwrite"
primary_region = "yyz"   # Toronto — the deals and the underwriting desk are Canadian

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
